name: Gameplay rules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: Tests/Gameplay/packages.lock.json
      - run: dotnet restore Tests/Gameplay/Gameplay.Tests.csproj --locked-mode
      - run: dotnet test Tests/Gameplay/Gameplay.Tests.csproj --no-restore --configuration Release
